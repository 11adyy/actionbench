name: Evaluate ActionBench

on:
  workflow_dispatch:
    inputs:
      action:
        description: "smoke = Docker checks; start = new campaign; resume = continue; raise-budget = increase ceiling"
        type: choice
        options: [smoke, start, resume, raise-budget]
        required: true
        default: smoke
      campaign:
        description: "Stable campaign ID (use the same value to resume)"
        type: string
        required: true
        default: pilot-001
      model:
        description: "Exact OpenAI model ID (required for start)"
        type: string
        required: false
      input_usd_per_million:
        description: "Verified input USD per million tokens (start)"
        type: string
        required: false
      output_usd_per_million:
        description: "Verified output USD per million tokens (start)"
        type: string
        required: false
      cached_input_usd_per_million:
        description: "Verified cached-input price; 0 if none"
        type: string
        required: false
        default: "0"
      cache_write_usd_per_million:
        description: "Verified cache-write USD per million tokens; optional"
        type: string
        required: false
      reasoning_effort:
        description: "Provider reasoning effort (for GPT-6 Luna choose none)"
        type: string
        required: false
      budget_usd:
        description: "Total model budget in USD (start; default 8)"
        type: string
        required: false
        default: "8"

permissions:
  contents: read
  actions: read

concurrency:
  group: actionbench-${{ inputs.campaign }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      AB_ACTION: ${{ inputs.action }}
      AB_CAMPAIGN: ${{ inputs.campaign }}
      AB_MODEL: ${{ inputs.model }}
      AB_INPUT_USD_PER_MILLION: ${{ inputs.input_usd_per_million }}
      AB_OUTPUT_USD_PER_MILLION: ${{ inputs.output_usd_per_million }}
      AB_CACHED_INPUT_USD_PER_MILLION: ${{ inputs.cached_input_usd_per_million }}
      AB_CACHE_WRITE_USD_PER_MILLION: ${{ inputs.cache_write_usd_per_million }}
      AB_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      AB_BUDGET_USD: ${{ inputs.budget_usd }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore and pin campaign source
        id: state
        run: bash cloud/github_state.sh restore
      - name: Install ActionBench
        run: python -m pip install -e .
      - name: Restore exact grader images
        id: images
        if: inputs.action == 'start' || inputs.action == 'resume'
        uses: actions/cache/restore@v4
        with:
          path: .cloud-state/grader-images.tar.gz
          key: actionbench-graders-${{ steps.state.outputs.source_sha }}
      - name: Run real Docker checks and campaign
        id: worker
        run: bash cloud/github_worker.sh
      - name: Save grader images for reproducible resume
        if: always() && (inputs.action == 'start' || inputs.action == 'resume') && steps.images.outputs.cache-hit != 'true' && hashFiles('.cloud-state/grader-images.tar.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .cloud-state/grader-images.tar.gz
          key: actionbench-graders-${{ steps.state.outputs.source_sha }}
      - name: Pack durable campaign state
        if: always() && inputs.action != 'smoke'
        run: bash cloud/github_state.sh pack
      - name: Save resumable state and report
        if: always() && inputs.action != 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: actionbench-state-${{ inputs.campaign }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloud-state/state.tar.gz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
