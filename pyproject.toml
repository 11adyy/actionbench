[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionbench"
version = "0.1.0"
description = "Resumable, real-API evaluation harness for skill actions"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.2.2"]

[project.scripts]
actionbench = "actionbench.cli:main"

[tool.setuptools.packages.find]
include = ["actionbench*"]
