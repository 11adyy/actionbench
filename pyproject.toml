[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionbench"
version = "0.1.0"
description = "Resumable, real-API evaluation harness for skill actions"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.2.2", "jsonschema>=4.21,<5"]

[project.scripts]
actionbench = "actionbench.cli:main"
actionbench-v2 = "actionbench.v2_cli:main"

[project.optional-dependencies]
v2 = [
  "deepagents==0.6.12",
  "langchain==1.4.3",
  "langchain-openai==1.6.7",
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[tool.setuptools.packages.find]
include = ["actionbench*"]
